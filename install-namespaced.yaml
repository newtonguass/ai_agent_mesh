# No CRDs, Namespace, ClusterRole or ClusterRoleBinding. Apply to an EXISTING namespace.
# Replace every namespace: example; publish approved ca.crt before declaring MTLS/Expose.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mesh-access-controller
  namespace: example
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mesh-access-controller
  namespace: example
rules:
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - get
  - list
- apiGroups:
  - apps
  resources:
  - deployments
  - statefulsets
  - daemonsets
  verbs:
  - get
  - list
  - patch
- apiGroups:
  - ''
  resources:
  - services
  verbs:
  - get
  - list
- apiGroups:
  - networking.istio.io
  resources:
  - gateways
  verbs:
  - get
  - list
- apiGroups:
  - networking.istio.io
  resources:
  - serviceentries
  - destinationrules
  - virtualservices
  - envoyfilters
  - sidecars
  verbs:
  - get
  - list
  - create
  - patch
  - delete
- apiGroups:
  - ''
  resources:
  - serviceaccounts
  verbs:
  - get
  - list
- apiGroups:
  - ''
  resources:
  - configmaps
  resourceNames:
  - mesh-access-config
  - mesh-access-declarations
  - mesh-access-trust
  - mesh-access-state
  verbs:
  - get
- apiGroups:
  - ''
  resources:
  - configmaps
  resourceNames:
  - mesh-access-state
  verbs:
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mesh-access-controller
  namespace: example
subjects:
- kind: ServiceAccount
  name: mesh-access-controller
  namespace: example
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mesh-access-controller
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mesh-access-controller
  namespace: example
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mesh-access-controller
  template:
    metadata:
      labels:
        app: mesh-access-controller
      annotations:
        sidecar.istio.io/inject: 'false'
    spec:
      serviceAccountName: mesh-access-controller
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: controller
        image: mesh-access-controller:dev
        imagePullPolicy: IfNotPresent
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        args:
        - --mode=namespace
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mesh-access-config
  namespace: example
data:
  config.json: "{\n  \"schemaVersion\": 1,\n  \"forbiddenNamespaces\": [\"istio-system\"\
    , \"kube-system\", \"kube-public\", \"kube-node-lease\"],\n  \"trustBundle\":\
    \ {\"name\": \"mesh-access-trust\"},\n  \"gateway\": {\"service\": \"ingressgateway\"\
    , \"port\": 443}\n}\n"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mesh-access-state
  namespace: example
data:
  purpose: AgentMesh ownership and status; retain while generated resources exist.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mesh-access-declarations
  namespace: example
data:
  declarations.json: '{"schemaVersion":1,"egress":[],"expose":[]}'
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mesh-access-trust
  namespace: example
data:
  ca.crt: REPLACE_WITH_ADMINISTRATOR_APPROVED_PUBLIC_PEM_BUNDLE
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agentmesh-developer
  namespace: example
rules:
- apiGroups:
  - ''
  resources:
  - configmaps
  resourceNames:
  - mesh-access-declarations
  verbs:
  - get
  - update
  - patch
- apiGroups:
  - ''
  resources:
  - configmaps
  resourceNames:
  - mesh-access-state
  verbs:
  - get
