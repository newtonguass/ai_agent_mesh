# Apply once per cluster as an administrator. CRD installation is separate.
apiVersion: v1
kind: Namespace
metadata:
  name: agentmesh-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mesh-access-controller
  namespace: agentmesh-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mesh-access-controller
rules:
- apiGroups: [agentmesh.io]
  resources: [agentmeshegresses, agentmeshexposes, agentmeshtrustedbundles]
  verbs: [get, list]
- apiGroups: [agentmesh.io]
  resources: [agentmeshegresses/status, agentmeshexposes/status, agentmeshtrustedbundles/status]
  verbs: [patch]
- apiGroups: [""]
  resources: [namespaces, serviceaccounts]
  verbs: [get, list]
- apiGroups: [""]
  resources: [configmaps]
  verbs: [get, list, create, patch]
- apiGroups: [""]
  resources: [pods]
  verbs: [get, list]
- apiGroups: [apps]
  resources: [deployments, statefulsets, daemonsets]
  verbs: [get, list, patch]
- apiGroups: [""]
  resources: [services]
  verbs: [get, list, create, patch, delete]
- apiGroups: [networking.istio.io]
  resources: [serviceentries, destinationrules, virtualservices, envoyfilters, gateways, sidecars]
  verbs: [get, list, create, patch, delete]
- apiGroups: [security.istio.io]
  resources: [authorizationpolicies]
  verbs: [get, list, create, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mesh-access-controller
subjects:
- kind: ServiceAccount
  name: mesh-access-controller
  namespace: agentmesh-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mesh-access-controller
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mesh-access-controller
  namespace: agentmesh-system
spec:
  replicas: 1
  # One active controller per cluster. No leader election; avoid overlapping revisions.
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: mesh-access-controller}
  template:
    metadata:
      labels: {app: mesh-access-controller}
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      serviceAccountName: mesh-access-controller
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: controller
        image: mesh-access-controller:dev
        imagePullPolicy: IfNotPresent
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef: {fieldPath: metadata.namespace}
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {cpu: 500m, memory: 256Mi}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mesh-access-config
  namespace: agentmesh-system
data:
  config.json: |
    {
      "schemaVersion": 1,
      "forbiddenNamespaces": ["istio-system", "kube-system", "kube-public", "kube-node-lease"],
      "trustBundle": {"name": "mesh-access-trust"},
      "gateway": {"service": "ingressgateway", "port": 443, "credentialName": "mesh-access-gateway-tls"}
    }
---
# Bind this ClusterRole with a RoleBinding in each developer's application namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agentmesh-developer
rules:
- apiGroups: [agentmesh.io]
  resources: [agentmeshegresses, agentmeshexposes]
  verbs: [get, list, watch, create, update, patch, delete]
---
# Optional delegation for trusted platform administrators; no default binding.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agentmesh-trust-admin
rules:
- apiGroups: [agentmesh.io]
  resources: [agentmeshtrustedbundles]
  verbs: [get, list, watch, create, update, patch, delete]
