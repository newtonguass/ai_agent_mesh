apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: agentmeshegresses.agentmesh.io
spec:
  group: agentmesh.io
  scope: Namespaced
  names:
    kind: AgentMeshEgress
    plural: agentmeshegresses
    singular: agentmeshegress
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: {}
    additionalPrinterColumns:
    - name: ServiceAccount
      type: string
      jsonPath: .spec.serviceAccount
    - name: Configured
      type: string
      jsonPath: .status.conditions[?(@.type=="Configured")].status
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp
    schema:
      openAPIV3Schema:
        type: object
        required:
        - spec
        properties:
          spec:
            type: object
            required:
            - serviceAccount
            properties:
              serviceAccount:
                type: string
                minLength: 1
                maxLength: 253
              inCluster:
                type: array
                maxItems: 64
                items: &id001
                  type: object
                  required:
                  - host
                  - port
                  - protocol
                  properties:
                    host:
                      type: string
                      minLength: 1
                      maxLength: 253
                    port:
                      type: integer
                      minimum: 1
                      maximum: 65535
                    protocol:
                      type: string
                      enum:
                      - HTTP
                      - HTTPS
                      - TCP
                      - MTLS
                      - http
                      - https
                      - tcp
                      - mtls
                      - mTLS
                    serverName:
                      type: string
                      maxLength: 253
                    endpoint:
                      type: string
                      maxLength: 280
                    addresses:
                      type: array
                      maxItems: 64
                      items:
                        type: string
                        maxLength: 45
              outCluster:
                type: array
                maxItems: 64
                items: *id001
          status:
            type: object
            properties:
              observedGeneration:
                type: integer
                format: int64
              applicationURLs:
                type: array
                items:
                  type: string
              conditions:
                type: array
                x-kubernetes-list-type: map
                x-kubernetes-list-map-keys:
                - type
                items:
                  type: object
                  required:
                  - type
                  - status
                  - reason
                  - message
                  - lastTransitionTime
                  properties:
                    type:
                      type: string
                    status:
                      type: string
                      enum:
                      - 'True'
                      - 'False'
                      - Unknown
                    reason:
                      type: string
                    message:
                      type: string
                    observedGeneration:
                      type: integer
                      format: int64
                    lastTransitionTime:
                      type: string
                      format: date-time
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: agentmeshexposes.agentmesh.io
spec:
  group: agentmesh.io
  scope: Namespaced
  names:
    kind: AgentMeshExpose
    plural: agentmeshexposes
    singular: agentmeshexpose
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: {}
    additionalPrinterColumns:
    - name: Service
      type: string
      jsonPath: .spec.service
    - name: Configured
      type: string
      jsonPath: .status.conditions[?(@.type=="Configured")].status
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp
    schema:
      openAPIV3Schema:
        type: object
        required:
        - spec
        properties:
          spec:
            type: object
            required:
            - service
            - port
            - host
            - gatewaySelector
            - allow
            properties:
              service:
                type: string
                maxLength: 63
              port: &id001
                type: integer
                minimum: 1
                maximum: 65535
              host:
                type: string
                maxLength: 253
              gatewaySelector:
                type: object
                minProperties: 1
                additionalProperties:
                  type: string
                  minLength: 1
              gatewayService:
                type: string
                maxLength: 63
              gatewayPort: *id001
              credentialName:
                type: string
                maxLength: 253
              allow:
                type: array
                minItems: 1
                maxItems: 256
                items:
                  type: string
                  maxLength: 512
                  pattern: ^[a-z0-9.-]+/ns/[a-z0-9-]+/sa/[a-z0-9.-]+$
                description: Exact authenticated requester principals, trust-domain/ns/namespace/sa/account,
                  without spiffe://.
          status:
            type: object
            properties:
              observedGeneration:
                type: integer
                format: int64
              applicationURLs:
                type: array
                items:
                  type: string
              conditions:
                type: array
                x-kubernetes-list-type: map
                x-kubernetes-list-map-keys:
                - type
                items:
                  type: object
                  required:
                  - type
                  - status
                  - reason
                  - message
                  - lastTransitionTime
                  properties:
                    type:
                      type: string
                    status:
                      type: string
                      enum:
                      - 'True'
                      - 'False'
                      - Unknown
                    reason:
                      type: string
                    message:
                      type: string
                    observedGeneration:
                      type: integer
                      format: int64
                    lastTransitionTime:
                      type: string
                      format: date-time
---
