# Apply with kubectl -n YOUR_NAMESPACE. CRD installation is separate and cluster-wide.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mesh-access-controller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mesh-access-controller
rules:
- apiGroups: [mesh-access.example.com]
  resources: [meshaccesses]
  verbs: [get, list]
- apiGroups: [mesh-access.example.com]
  resources: [meshaccesses/status]
  verbs: [patch]
- apiGroups: [""]
  resources: [configmaps, serviceaccounts]
  verbs: [get, list]
- apiGroups: [""]
  resources: [pods]
  verbs: [get, list]
- apiGroups: [apps]
  resources: [deployments, statefulsets, daemonsets]
  verbs: [get, list, patch]
- apiGroups: [""]
  resources: [services]
  verbs: [get, list, create, patch, delete]
- apiGroups: [networking.istio.io]
  resources: [serviceentries, destinationrules, virtualservices, envoyfilters, gateways]
  verbs: [get, list, create, patch, delete]
- apiGroups: [security.istio.io]
  resources: [authorizationpolicies]
  verbs: [get, list, create, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mesh-access-controller
subjects:
- kind: ServiceAccount
  name: mesh-access-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mesh-access-controller
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mesh-access-controller
spec:
  replicas: 1
  # One controller per namespace. No leader election; avoid overlapping revisions.
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: mesh-access-controller}
  template:
    metadata:
      labels: {app: mesh-access-controller}
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      serviceAccountName: mesh-access-controller
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: controller
        image: mesh-access-controller:dev
        imagePullPolicy: IfNotPresent
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef: {fieldPath: metadata.namespace}
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {cpu: 500m, memory: 256Mi}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mesh-access-config
data:
  config.json: |
    {
      "schemaVersion": 1,
      "forbiddenNamespaces": ["istio-system"],
      "trustBundle": {"name": "mesh-access-trust", "key": "ca.crt"},
      "gateway": {"service": "ingressgateway", "port": 443, "credentialName": "mesh-access-gateway-tls"}
    }
