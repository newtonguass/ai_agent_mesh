apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: meshaccesses.mesh-access.example.com
spec:
  group: mesh-access.example.com
  scope: Namespaced
  names:
    plural: meshaccesses
    singular: meshaccess
    kind: MeshAccess
    shortNames:
    - ma
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: {}
    additionalPrinterColumns:
    - name: ServiceAccount
      type: string
      jsonPath: .spec.serviceAccount
    - name: Configured
      type: string
      jsonPath: .status.conditions[?(@.type=="Configured")].status
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp
    schema:
      openAPIV3Schema:
        type: object
        required:
        - spec
        properties:
          spec:
            type: object
            required:
            - serviceAccount
            properties:
              serviceAccount:
                type: string
                minLength: 1
                maxLength: 253
                description: Existing ServiceAccount in this namespace; one MeshAccess
                  per account.
              requests:
                type: array
                maxItems: 64
                items:
                  type: object
                  required:
                  - url
                  properties:
                    url:
                      type: string
                      maxLength: 280
                      pattern: ^https://[a-z0-9][a-z0-9.-]+(:[0-9]+)?/?$
                      description: Remote HTTPS origin. Application uses HTTP on this
                        port; sidecar originates mTLS.
                    endpoint:
                      type: string
                      maxLength: 280
                      description: Optional remote gateway DNS-name:port or IPv4:port;
                        defaults to the URL host and port. Does not configure application
                        DNS.
              exposes:
                type: array
                maxItems: 64
                items:
                  type: object
                  required:
                  - service
                  - url
                  - allow
                  properties:
                    service:
                      type: string
                      maxLength: 63
                      description: Existing local HTTP Service whose pods use spec.serviceAccount.
                    port:
                      type: integer
                      minimum: 1
                      maximum: 65535
                      description: Backend Service port, not pod port. May be omitted
                        for a single-port Service.
                    url:
                      type: string
                      maxLength: 280
                      pattern: ^https://[a-z0-9][a-z0-9.-]+(:[0-9]+)?/?$
                      description: Public HTTPS origin covered by the namespace gateway
                        credential certificate.
                    allow:
                      type: array
                      minItems: 1
                      maxItems: 256
                      items:
                        type: string
                        maxLength: 512
                        pattern: ^[a-z0-9.-]+/ns/[a-z0-9-]+/sa/[a-z0-9.-]+$
                      description: Exact authenticated requester principals, trust-domain/ns/namespace/sa/account,
                        without spiffe://.
          status:
            type: object
            properties:
              observedGeneration:
                type: integer
                format: int64
              applicationURLs:
                type: array
                items:
                  type: string
              conditions:
                type: array
                x-kubernetes-list-type: map
                x-kubernetes-list-map-keys:
                - type
                items:
                  type: object
                  required:
                  - type
                  - status
                  - reason
                  - message
                  - lastTransitionTime
                  properties:
                    type:
                      type: string
                    status:
                      type: string
                      enum:
                      - 'True'
                      - 'False'
                      - Unknown
                    reason:
                      type: string
                    message:
                      type: string
                    observedGeneration:
                      type: integer
                      format: int64
                    lastTransitionTime:
                      type: string
                      format: date-time
---
