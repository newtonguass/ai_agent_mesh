apiVersion: agentmesh.io/v1alpha1
kind: AgentMeshEgress
metadata:
  name: agent
  namespace: example
spec:
  serviceAccount: agent-client
  inCluster:
  - host: orders
    port: 8080
    protocol: HTTP
  outCluster:
  - host: orders-agent-mesh.remote.example.com
    port: 443
    protocol: MTLS
  - host: api.example.com
    port: 443
    protocol: HTTPS
---
apiVersion: agentmesh.io/v1alpha1
kind: AgentMeshExpose
metadata:
  name: orders
  namespace: example
spec:
  service: orders
  port: 8080
  host: orders-agent-mesh.company.example.com
  gatewaySelector:
    istio: aspe-ingressgateway
  allow:
  - remote-mesh/ns/example/sa/agent-client
---
# Cluster administrator applies one shared bundle per cluster. No namespace.
apiVersion: agentmesh.io/v1alpha1
kind: AgentMeshTrustedBundle
metadata:
  name: mesh-access-trust
spec:
  caBundle: |
    -----BEGIN CERTIFICATE-----
    REPLACE_WITH_APPROVED_PUBLIC_CA_CERTIFICATE
    -----END CERTIFICATE-----
