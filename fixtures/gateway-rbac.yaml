# Lab fixture only: provisions the isolated test gateway owner's SDS permissions.
# Not part of AgentMesh installation; never apply over an existing user gateway.
# Istio 1.13.5 SDS specifically checks namespace-wide list secrets permission.
# This is NOT a permission granted to mesh-access-controller.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mesh-access-gateway-sds
rules:
- apiGroups: [""]
  resources: [secrets]
  verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mesh-access-gateway-sds
subjects:
- kind: ServiceAccount
  name: ingressgateway
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mesh-access-gateway-sds
